<?xml version="1.0" encoding="UTF-8"?>
<!--
  sodatelu 仮ロゴ - maskable版
  - PWA maskable icon は safe zone 80% に内容を収める必要あり
  - 背景は全面 amber-500 (#f59e0b) で塗り、芽は中心の安全領域内に配置
  - 512x512 ベース。中心 (256,256) を中央に、半径 ~205 (=80%/2) の円内に芽が収まる設計
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="sodatelu">
  <!-- 背景全面塗り（角まで amber） -->
  <rect width="512" height="512" fill="#f59e0b"/>

  <!-- 芽は safe zone (中央 80%) 内に収める。元512基準のロゴを 0.8 倍縮小 -->
  <g transform="translate(51.2 51.2) scale(0.8)">
    <!-- 茎 -->
    <path d="M256 360 L256 250"
          stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- 左の葉 -->
    <path d="M256 270
             C 256 230, 220 200, 170 200
             C 170 240, 210 270, 256 270 Z"
          fill="#ffffff"/>

    <!-- 右の葉 -->
    <path d="M256 270
             C 256 230, 292 200, 342 200
             C 342 240, 302 270, 256 270 Z"
          fill="#ffffff"/>

    <!-- 中心くぼみ -->
    <circle cx="256" cy="270" r="8" fill="#f59e0b"/>
  </g>
</svg>
